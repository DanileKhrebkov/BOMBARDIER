name: "WebSocket Эхо тест"
settings:
  workers: 3
  duration: 15s

steps:
  - name: "echo_test"
    protocol: websocket
    url: "wss://echo.websocket.org"
    messages:
      - send: "Hello WebSocket!"
        expect: "Hello WebSocket!"
        wait: 1s
      - send: '{"type": "ping", "data": "test"}'
        expect: "ping"
        wait: 1s
    timeout: 10s

assertions:
  - error_rate < 50%
  - p95 < 3000ms
